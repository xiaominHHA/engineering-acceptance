services:
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
      target: runtime
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:?set production profile}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:?set database}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:?set user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?set password}
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/${MONGO_DATABASE:?set database}
      SPRING_MONGODB_URI: mongodb://mongo:27017/${MONGO_DATABASE:?set database}
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:?server-assigned loopback port}:8080"
    networks:
      internal:
      edge:
        aliases: [wm7023-backend]
    mem_limit: ${BACKEND_MEMORY_LIMIT:?server-confirmed memory limit}
    depends_on:
      mysql: { condition: service_healthy }
      mongo: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }
  mysql:
    image: mysql:8.4.6
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?set database}
      MYSQL_USER: ${MYSQL_USER:?set user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set root password}
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:?server-assigned SSH tunnel port}:3306"
    networks: [internal]
    mem_limit: ${MYSQL_MEMORY_LIMIT:?server-confirmed memory limit}
    volumes: [production_mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 30
    logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }
  mongo:
    image: mongo:8.0.13
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:?set database}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?set root user}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?set root password}
    ports:
      - "127.0.0.1:${MONGO_HOST_PORT:?server-assigned SSH tunnel port}:27017"
    networks: [internal]
    mem_limit: ${MONGO_MEMORY_LIMIT:?server-confirmed memory limit}
    volumes: [production_mongo_data:/data/db]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }
volumes:
  production_mysql_data:
  production_mongo_data:
networks:
  internal:
    name: wm7023-internal
  edge:
    name: wm7023-edge
    external: true
