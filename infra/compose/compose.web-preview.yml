services:
  gateway:
    image: caddy@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_GATEWAY_PORT:-18024}:8080"
    volumes:
      - ../web/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${WEB_ROOT:?WEB_ROOT is required}:/srv:ro
    networks:
      - edge

  tunnel:
    image: cloudflare/cloudflared@sha256:51c9cefcb4569df44e1ad403ab1d3d8065aa8e84339bcfc6aee75502e1140339
    restart: unless-stopped
    network_mode: host
    command:
      - tunnel
      - --no-autoupdate
      - --url
      - http://127.0.0.1:${WEB_GATEWAY_PORT:-18024}
    depends_on:
      - gateway

networks:
  edge:
    external: true
    name: wm7023-edge
