services:
  backend:
    image: engineering-acceptance-backend:${SMOKE_IMAGE_TAG:?set unique smoke image tag}
    build:
      context: ../../backend
      dockerfile: Dockerfile
      target: runtime
      args:
        RELEASE_VERSION: ${SMOKE_RELEASE_VERSION:-0.0.0-smoke}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-1970-01-01T00:00:00Z}
    environment:
      SPRING_PROFILES_ACTIVE: production
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:?set database}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:?set user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?set password}
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_APP_USERNAME:?set app user}:${MONGO_APP_PASSWORD:?set app password}@mongo:27017/${MONGO_DATABASE:?set database}?authSource=${MONGO_DATABASE:?set database}
      SPRING_MONGODB_URI: mongodb://${MONGO_APP_USERNAME:?set app user}:${MONGO_APP_PASSWORD:?set app password}@mongo:27017/${MONGO_DATABASE:?set database}?authSource=${MONGO_DATABASE:?set database}
      APP_AUTH_SIGNING_KEY: ${APP_AUTH_SIGNING_KEY:?set auth signing key}
      APP_AUTH_TOKEN_TTL: ${APP_AUTH_TOKEN_TTL:-PT5M}
    ports:
      - "127.0.0.1:${SMOKE_BACKEND_HOST_PORT:?set temporary loopback port}:8080"
    mem_limit: 512m
    depends_on:
      mysql: { condition: service_healthy }
      mongo: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q 'UP'"]
      interval: 5s
      timeout: 5s
      retries: 24
  mysql:
    image: mysql:8.4.6
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?set database}
      MYSQL_USER: ${MYSQL_USER:?set user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set root password}
    mem_limit: 384m
    volumes: [smoke_mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --protocol=tcp -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 30
  mongo:
    image: mongo:8.0.13
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:?set database}
      MONGO_DATABASE: ${MONGO_DATABASE:?set database}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?set root user}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?set root password}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:?set app user}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?set app password}
    mem_limit: 256m
    volumes:
      - smoke_mongo_data:/data/db
      - ../production/mongo/init-app-user.js:/docker-entrypoint-initdb.d/10-create-app-user.js:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  smoke_mysql_data:
  smoke_mongo_data:
