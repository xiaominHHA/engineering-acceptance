name: CI

on:
  push:
    branches: [main, develop, 'feat/**', 'release/**']
  pull_request:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - name: Run project quality gate
        run: ./check.sh
      - name: Upload release artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: engineering-acceptance-1.0.0
          path: dist/
