name: CI

on:
  push:
    branches: [main, develop, 'feat/**', 'release/**']
    tags: ['v*']
  pull_request:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - name: Prepare Android release signing
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-release.jks"
          chmod 600 "$RUNNER_TEMP/android-release.jks"
      - name: Run project quality gate
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          ANDROID_BUILD_TYPE: debug
        run: ./check.sh
      - name: Run signed release quality gate
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/android-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./check.sh
      - name: Resolve artifact version
        if: startsWith(github.ref, 'refs/tags/v')
        id: metadata
        run: ./scripts/release-metadata.sh --github-output >> "$GITHUB_OUTPUT"
      - name: Upload release artifacts
        if: startsWith(github.ref, 'refs/tags/v') && success()
        uses: actions/upload-artifact@v4
        with:
          name: engineering-acceptance-${{ steps.metadata.outputs.version }}
          path: dist/
